
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather & Air Quality Dashboard</title>

<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --text: #e2e8f0;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 22px;
  font-family: "Segoe UI", system-ui, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e1b4b);
  color: var(--text);
  min-height: 100vh;
}
.container { max-width: 1200px; margin: auto; }
header { text-align: center; margin: 10px 0 26px; }
h1 { color: #7dd3fc; }
header p, .muted { color: var(--muted); }
.search {
  display: flex;
  gap: 10px;
  max-width: 620px;
  margin: 20px auto;
}
input, button {
  padding: 13px 16px;
  border-radius: 10px;
  font: inherit;
}
input {
  flex: 1;
  min-width: 0;
  background: var(--card);
  color: var(--text);
  border: 1px solid #475569;
}
button {
  border: 0;
  background: linear-gradient(90deg, #38bdf8, #a78bfa);
  color: #0f172a;
  font-weight: 700;
  cursor: pointer;
}
button:disabled { opacity: .6; cursor: wait; }
#status {
  text-align: center;
  margin: 12px auto;
  padding: 10px;
  border-radius: 10px;
}
#status:empty { display: none; }
.error { background: #7f1d1d; color: #fecaca; }
.loading { background: #164e63; color: #bae6fd; }
#location { text-align: center; margin: 24px 0; }
#location h2 { margin-bottom: 4px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 15px;
  margin: 18px 0;
}
.card, .forecast-day, .chart {
  background: rgba(30, 41, 59, .95);
  border: 1px solid #334155;
  border-radius: 15px;
  padding: 19px;
  min-width: 0;
}
.label {
  color: var(--muted);
  font-size: .78rem;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.value {
  font-size: 1.8rem;
  font-weight: 750;
  margin: 8px 0;
  color: white;
}
.sub { color: var(--muted); font-size: .85rem; }
.aqi-card { grid-column: span 2; }
.badge {
  display: inline-block;
  padding: 5px 12px;
  border-radius: 20px;
  color: #111;
  font-weight: 700;
  font-size: .8rem;
}
.pollutants {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 15px;
}
.pollutant {
  padding: 7px 10px;
  background: #334155;
  border-radius: 8px;
  font-size: .85rem;
}
.pollutant b { color: #bae6fd; margin-right: 5px; }
h2.section { font-size: 1.2rem; margin: 28px 0 12px; }
.forecast {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 12px;
}
.forecast-day { text-align: center; padding: 15px; }
.day { font-weight: 700; }
.date, .desc { color: var(--muted); font-size: .8rem; margin-top: 6px; }
.icon { font-size: 1.8rem; margin: 10px; }
.temps { display: flex; justify-content: center; gap: 8px; font-size: .85rem; }
.high { color: #fca5a5; }
.low { color: #93c5fd; }
.chart { margin-top: 20px; height: 330px; }
footer {
  text-align: center;
  color: var(--muted);
  font-size: .8rem;
  margin: 35px 0 10px;
}
[hidden] { display: none !important; }

@media (max-width: 600px) {
  body { padding: 13px; }
  .search { flex-direction: column; }
  .aqi-card { grid-column: span 1; }
  h1 { font-size: 1.55rem; }
  .value { font-size: 1.55rem; }
}
</style>
</head>

<body>
<main class="container">
  <header>
    <h1>🌤 Weather & Air Quality Dashboard</h1>
    <p>Live weather, air pollution readings and a 7-day forecast powered by Open-Meteo</p>
  </header>

  <form class="search" id="searchForm">
    <input
      id="cityInput"
      aria-label="City name"
      placeholder="Enter a city (e.g. Vijayawada, London, Tokyo)"
      autocomplete="off"
      maxlength="100"
      required
    >
    <button id="searchBtn" type="submit">Search</button>
  </form>

  <div id="status" role="status" aria-live="polite"></div>

  <section id="location" hidden>
    <h2 id="locationName"></h2>
    <div class="muted" id="updatedTime"></div>
  </section>

  <section class="grid" id="weatherGrid" aria-label="Current weather"></section>
  <section class="grid" id="airGrid" aria-label="Air quality"></section>

  <h2 class="section" id="forecastTitle" hidden>📅 7-Day Forecast</h2>
  <section class="forecast" id="forecastGrid"></section>

  <section class="chart" id="chartBox" hidden>
    <h2 class="section">📈 Temperature Trend (7 days)</h2>
    <canvas id="tempChart"></canvas>
  </section>

  <footer>
    Data: Open-Meteo APIs · Educational project · Not for medical or official use
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script>
"use strict";

const ICONS = {
  0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️",
  45: "🌫️", 48: "🌫️", 51: "🌦️", 53: "🌦️",
  55: "🌧️", 61: "🌧️", 63: "🌧️", 65: "⛈️",
  71: "🌨️", 73: "🌨️", 75: "❄️", 77: "❄️",
  80: "🌦️", 81: "🌧️", 82: "⛈️",
  85: "🌨️", 86: "🌨️", 95: "⛈️", 96: "⛈️", 99: "⛈️"
};

const $ = id => document.getElementById(id);
const form = $("searchForm");
const input = $("cityInput");
const button = $("searchBtn");
const status = $("status");
let chart = null;

function setStatus(message, type = "") {
  status.textContent = message;
  status.className = type;
}

function fmt(value, unit = "", digits = 1) {
  if (value === null || value === undefined || value === "" ||
      !Number.isFinite(Number(value))) {
    return "N/A";
  }
  return Number(value).toFixed(digits) + unit;
}

function safeText(value) {
  return value === null || value === undefined ? "N/A" : String(value);
}

function renderWeather(w) {
  $("weatherGrid").innerHTML = `
    <article class="card">
      <div class="label">Temperature</div>
      <div class="value">${fmt(w.temperature_c, "°C")}</div>
      <div class="sub">Feels like ${fmt(w.feels_like_c, "°C")}</div>
    </article>
    <article class="card">
      <div class="label">Condition</div>
      <div class="value" style="font-size:1.25rem">
        ${ICONS[w.weather_code] || "❓"} ${safeText(w.description)}
      </div>
      <div class="sub">Weather code: ${safeText(w.weather_code)}</div>
    </article>
    <article class="card">
      <div class="label">Humidity</div>
      <div class="value">${fmt(w.humidity_percent, "%", 0)}</div>
      <div class="sub">Relative humidity</div>
    </article>
    <article class="card">
      <div class="label">Wind speed</div>
      <div class="value">${fmt(w.wind_speed_kmh, " km/h")}</div>
      <div class="sub">Measured at 10 m</div>
    </article>`;
}

function renderAir(a) {
  const pollutants = [
    ["PM2.5", a.pm2_5], ["PM10", a.pm10], ["CO", a.co],
    ["NO₂", a.no2], ["SO₂", a.so2], ["O₃", a.o3]
  ];

  $("airGrid").innerHTML = `
    <article class="card aqi-card">
      <div class="label">US Air Quality Index</div>
      <div class="value">${a.aqi == null ? "N/A" : fmt(a.aqi, "", 0)}</div>
      <span class="badge" style="background:${a.aqi_color || "#888"}">
        ${safeText(a.aqi_category)}
      </span>
      <div class="pollutants">
        ${pollutants.map(([name, value]) => `
          <div class="pollutant">
            <b>${name}</b>${fmt(value, " µg/m³")}
          </div>`).join("")}
      </div>
    </article>`;
}

function renderForecast(days) {
  const grid = $("forecastGrid");
  grid.innerHTML = "";
  $("forecastTitle").hidden = !days || days.length === 0;

  if (!days || days.length === 0) return;

  for (const day of days) {
    const date = new Date(day.date + "T00:00:00");
    const element = document.createElement("article");
    element.className = "forecast-day";

    element.innerHTML = `
      <div class="day">${date.toLocaleDateString(undefined, {weekday: "short"})}</div>
      <div class="date">${date.toLocaleDateString(undefined, {month: "short", day: "numeric"})}</div>
      <div class="icon">${ICONS[day.weather_code] || "❓"}</div>
      <div class="temps">
        <span class="high">▲ ${fmt(day.high_c, "°", 0)}</span>
        <span class="low">▼ ${fmt(day.low_c, "°", 0)}</span>
      </div>
      <div class="desc"></div>`;

    element.querySelector(".desc").textContent = day.description || "Unknown";
    grid.appendChild(element);
  }
}

function renderChart(days) {
  $("chartBox").hidden = !days || days.length === 0;
  if (!days || days.length === 0) return;

  if (typeof Chart === "undefined") {
    setStatus("Weather loaded, but the chart library could not load.", "error");
    return;
  }

  if (chart) chart.destroy();

  const labels = days.map(day =>
    new Date(day.date + "T00:00:00").toLocaleDateString(
      undefined, {month: "short", day: "numeric"}
    )
  );

  chart = new Chart($("tempChart"), {
    type: "line",
    data: {
      labels,
      datasets: [
        {
          label: "High °C",
          data: days.map(day => day.high_c),
          borderColor: "#fb7185",
          backgroundColor: "rgba(251,113,133,.12)",
          tension: 0.3
        },
        {
          label: "Low °C",
          data: days.map(day => day.low_c),
          borderColor: "#60a5fa",
          backgroundColor: "rgba(96,165,250,.12)",
          tension: 0.3
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: "#e2e8f0" } }
      },
      scales: {
        x: { ticks: { color: "#94a3b8" } },
        y: {
          ticks: { color: "#94a3b8" },
          title: {
            display: true,
            text: "Temperature (°C)",
            color: "#94a3b8"
          }
        }
      }
    }
  });
}

async function loadDashboard(city) {
  button.disabled = true;
  button.textContent = "Loading…";
  setStatus("Fetching weather and air-quality data…", "loading");

  try {
    const response = await fetch(
      `/api/dashboard?city=${encodeURIComponent(city)}`
    );
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Unable to load dashboard.");
    }

    $("locationName").textContent = "📍 " + data.location.name;
    $("updatedTime").textContent = "Updated: " + data.updated_at;
    $("location").hidden = false;

    renderWeather(data.weather.current);
    renderAir(data.air_quality.current);
    renderForecast(data.weather.daily);
    renderChart(data.weather.daily);

    if (status.className !== "error") setStatus("");
  } catch (error) {
    setStatus("⚠ " + (error.message || "Unexpected error."), "error");
    $("location").hidden = true;
    $("weatherGrid").innerHTML = "";
    $("airGrid").innerHTML = "";
    $("forecastGrid").innerHTML = "";
    $("forecastTitle").hidden = true;
    $("chartBox").hidden = true;

    if (chart) {
      chart.destroy();
      chart = null;
    }
  } finally {
    button.disabled = false;
    button.textContent = "Search";
  }
}

form.addEventListener("submit", event => {
  event.preventDefault();
  const city = input.value.trim();

  if (!city) {
    setStatus("Please enter a city name.", "error");
    return;
  }

  loadDashboard(city);
});

window.addEventListener("DOMContentLoaded", () => {
  input.value = "Vijayawada";
  loadDashboard("Vijayawada");
});
</script>
</body>
</html>
